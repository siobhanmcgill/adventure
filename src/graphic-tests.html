<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agency</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />

    <style>
       * {
        animation-duration: 0ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0ms !important;
        transition-delay: 0ms !important;
        /* animation-duration: none !important;
        transition-duration: none !important; */
      }
    </style>
  </head>

  <body class="disable-animations">
    <div class="screen">
      <div class="content-wrapper">
        <svg
          id="svg"
          class="main-game-svg"></svg>

        <div class="action-buttons">
          <button
            class="button-look"
            title="Look"></button>
          <button
            class="button-interact"
            title="Interact"></button>
          <button
            class="button-pickup"
            title="Pick Up"></button>
          <button
            class="button-talk"
            title="Talk"></button>
        </div>

        <div class="inventory">
          <div class="toggle-shadow"></div>
          <div
            class="toggle"
            title="Inventory"></div>
          <div class="item-list-wrapper">
            <div class="item-list"></div>
          </div>
        </div>

        <div class="tools">
          <button id="debug-btn">Debug</button>
          <button id="reset-save-btn">Reset save</button>
          <button id="reset-room-btn">Reset room</button>
        </div>
      </div>
    </div>

    <div class="templates">
      <div class="quote panel">
        <div class="panel-title">
          <h5 class="character"></h5>
        </div>
        <div class="panel-contents-wrapper">
          <span class="panel-icon icon talk"> </span>
          <div class="panel-contents">
            <div class="quote-contents"></div>
          </div>
        </div>
      </div>

      <div class="popup-wrapper">
        <div class="popup">
          <div class="window panel">
            <div class="panel-title">
              <h5 class="popup-title">Message Reader Deluxe v1.9</h5>
            </div>
            <button class="red close-popup">x</button>
            <div class="panel-contents-wrapper">
              <div class="panel-contents">
                <div class="text"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="computer-icon"></div>
        <span class="click-message">(click to continue)</span>
      </div>
    </div>
  </body>
</html>
